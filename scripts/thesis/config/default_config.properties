#default config file
simulation_time=5
warm_up_period=2
file_log_enabled=true
deep_file_log_enabled=true

#logging is disabled if it is 0
vm_load_check_interval=0.1

#logging is disabled if it is 0
location_check_interval=0.1

#logging is disabled if it is 0
ap_delay_check_interval=0

min_number_of_mobile_devices=250
max_number_of_mobile_devices=350
mobile_device_counter_size=25

wan_propagation_delay=0.1
lan_internal_delay=0.0005
wlan_bandwidth=0
wan_bandwidth=0
man_bandwidth=100
gsm_bandwidth=0

#all the host on cloud runs on a single datacenter
number_of_host_on_cloud_datacenter=1
number_of_vm_on_cloud_host=4
core_for_cloud_vm=4
mips_for_cloud_vm=100000
ram_for_cloud_vm=32000
storage_for_cloud_vm=1000000

#mobile devices has no processing unit in this scenario
core_for_mobile_vm=0
mips_for_mobile_vm=0
ram_for_mobile_vm=0
storage_for_mobile_vm=0

#use ',' for multiple values 
orchestrator_policies=CENTRALIZED,DECENTRALIZED

#use ',' for multiple values
simulation_scenarios=DEFAULT_SCENARIO

#mean waiting time in seconds
attractiveness_L1_mean_waiting_time=15
attractiveness_L2_mean_waiting_time=9
attractiveness_L3_mean_waiting_time=4

# THESIS ADDITIONS (read independently by ThesisConfig, not by core SimSettings)
# region_count: number of decentralized control regions the edge hosts are split into,
# by contiguous WLAN-id rank. Hidden experimental variable - vary to test sensitivity.
region_count=4

# centralized scheduling delay reported up to ~9x decentralized dispatch (Kubernetes
# scheduling survey, ACM CSUR). Wired into simulated time in Step 3.
centralized_decision_delay=0.005
decentralized_decision_delay=0
